name: Probe Big 12 data sources

# TEMPORARY Step 0 probe — delete once its output has been read.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/probe-big12.mjs'
      - '.github/workflows/probe-big12.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run probe
        run: node scripts/probe-big12.mjs

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe-big12/
          git diff --cached --quiet || git commit -m "Add Big 12 data probe results [skip ci]"
          git push
