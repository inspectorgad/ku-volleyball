name: Probe opponent roster sources

# Temporary: answers whether an opponent's roster can be shown before the
# match is played, and from which source. Delete this workflow and
# scripts/probe-opponent-rosters.mjs once the answer is recorded.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/probe-opponent-rosters.mjs'
      - '.github/workflows/probe-opponent-rosters.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Probe roster sources
        run: node scripts/probe-opponent-rosters.mjs

      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe/
          git diff --cached --quiet || git commit -m "Opponent roster probe output [skip ci]"
          git push
