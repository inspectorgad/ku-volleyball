name: Build debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Signing keystores are stored base64-encoded in the repo; the build
      # expects them at ${rootDir}/debug.keystore and ${rootDir}/upload.keystore.
      - name: Restore keystores
        run: |
          base64 -d debug.keystore.base64 > debug.keystore
          base64 -d upload.keystore.base64 > upload.keystore

      - name: Run unit tests
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK and Play release bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug :app:bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ku-volleyball-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ku-volleyball-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Publish the APK to a rolling "latest-apk" release for one-tap phone
      # download:
      # https://github.com/inspectorgad/ku-volleyball/releases/latest/download/ku-volleyball.apk
      #
      # The assets are renamed off Gradle's generic app-debug.apk /
      # app-release.aab: the Diamonds app publishes its own build under exactly
      # those names, so downloading both left two indistinguishable files.
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Rolling release: always carries the newest APK with current season data. Download ku-volleyball.apk below and install it on your Android device."
          gh release view latest-apk --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest-apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KU Volleyball - latest build" \
              --notes "$NOTES" \
              --latest
          # Rewrite the notes every run: --notes above only applies when the
          # release is first created, so a rename would otherwise leave the
          # page telling people to download a file that no longer exists.
          gh release edit latest-apk --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          # Each file is uploaded under a temporary name and then renamed into
          # place, rather than with `gh release upload --clobber`.
          #
          # --clobber deletes the live asset and then uploads its replacement,
          # so the download URL 404s for as long as an 18 MB upload takes - on
          # every rebuild, and the feed dispatches one after every scrape. That
          # is several windows a day, and it is what someone hits when the link
          # "does not work": the release page looks fine, the file is simply not
          # there yet. Uploading first and renaming afterwards narrows the gap
          # from an upload to the moment between two API calls.
          #
          # The temporary name keeps the real extension - ku-volleyball.new.apk,
          # not ku-volleyball.apk.new - because GitHub sets an asset's content
          # type from it, and renaming does not revisit that. An APK served as a
          # generic binary is one some phones decline to install.
          swap_in() {
            local src="$1" name="$2" tmp="$3" live fresh
            cp "$src" "$tmp"
            gh release upload latest-apk "$tmp" --repo "$GITHUB_REPOSITORY" --clobber
            live=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-apk" \
              --jq ".assets[] | select(.name==\"$name\") | .id")
            fresh=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-apk" \
              --jq ".assets[] | select(.name==\"$tmp\") | .id")
            if [ -z "$fresh" ]; then
              echo "::error::$tmp did not upload; leaving $name as it was"
              return 1
            fi
            # An `if`, not `[ -n "$live" ] && ...`: the job runs under `set -e`,
            # where that list failing its test is a failing command, so the
            # first publish - the one with nothing to replace - would abort.
            if [ -n "$live" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$live"
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$fresh" -f name="$name"
            echo "published $name"
          }
          swap_in app/build/outputs/apk/debug/app-debug.apk \
            ku-volleyball.apk ku-volleyball.new.apk
          # The parsed season data rides along so the app can sync itself
          # without an APK reinstall.
          swap_in app/src/main/assets/seed.json \
            season-data.json season-data.new.json
          # Play Store bundle: download this and upload it to the Play
          # Console (internal testing) whenever the app code changes.
          swap_in app/build/outputs/bundle/release/app-release.aab \
            ku-volleyball.aab ku-volleyball.new.aab
          # Drop the pre-rename assets so the old ambiguous names cannot linger
          # on the release. A no-op once they are gone.
          for old in app-debug.apk app-release.aab; do
            gh release delete-asset latest-apk "$old" \
              --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done
