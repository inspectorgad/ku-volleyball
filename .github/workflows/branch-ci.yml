name: Branch CI

# Tests and builds on any branch but main, so larger changes (the shared
# Android/iOS code, to begin with) can be checked before they land. Unlike
# build-apk.yml it publishes nothing: the latest-apk release only ever
# carries what is on main.
on:
  push:
    branches-ignore:
      - main
    # The iPhone app and the Apple checks have their own workflows.
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'
      - '.github/workflows/apple-keys-check.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore keystores
        run: |
          base64 -d debug.keystore.base64 > debug.keystore
          base64 -d upload.keystore.base64 > upload.keystore

      # The Kotlin and KSP Gradle plugins the build actually resolved, for
      # checking that one Kotlin version runs the whole build.
      - name: Show the Kotlin plugin versions
        run: gradle buildEnvironment --no-configuration-cache | grep -E 'kotlin-gradle-plugin:|symbol-processing-gradle-plugin:' | sort -u

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
