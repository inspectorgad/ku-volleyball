name: Scrape KU volleyball data

on:
  workflow_dispatch:
  # Nightly at 09:00 UTC (4 AM Central) — after even late matches are final.
  # The 13:00 entry is a backstop, not a second collection: GitHub drops
  # scheduled runs under load and says nothing when it does, so on 2026-08-27
  # both this repo's 09:00 run and the Diamonds one simply never queued. A
  # missed night is invisible to every check we have, because nothing ran to
  # fail. A second attempt costs one no-op run: the scrape is idempotent and the
  # seed is only rewritten when the data actually differs.
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
  push:
    branches:
      - main
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-ku-volleyball.mjs'
      - 'scripts/update-seed.py'
      # A roster URL or parser change should verify itself on the spot rather
      # than wait for the next nightly cron.
      - 'scripts/opponent-sites.json'
      - 'scripts/roster-parser.mjs'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A hanging opponent site once held this job for 25 minutes with no output
    # and no data. With no limit it would have run to GitHub's 6-hour default,
    # burning the runner and skipping the night in silence. A normal run takes
    # about two minutes, so 20 is generous - and failing loudly beats hanging.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape NCAA + kuathletics data
        env:
          SEASONS: '2025 2026'
        run: node scripts/scrape-ku-volleyball.mjs

      - name: Rebuild seed from scraped data
        run: python3 scripts/update-seed.py

      - name: Commit scraped data and seed update
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraped/
          git diff --cached --quiet || git commit -m "Update scraped KU volleyball data [skip ci]"
          # The dashboard (GitHub Pages, docs/) reads its own copy of the seed.
          cp app/src/main/assets/seed.json docs/season-data.json
          git add app/src/main/assets/seed.json docs/season-data.json
          if git diff --cached --quiet; then
            echo "seed_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update season data from nightly scrape [skip ci]"
            echo "seed_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # Pushes made with GITHUB_TOKEN never trigger push workflows (GitHub's
      # recursion guard), so the APK rebuild must be dispatched explicitly —
      # workflow_dispatch is exempt from that guard.
      - name: Rebuild APK with new season data
        if: steps.commit.outputs.seed_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
