name: Scrape KU volleyball data

on:
  workflow_dispatch:
  # Every four hours, on the :37. Two things went wrong with one nightly run at
  # 09:00 and a backstop at 13:00, and this addresses both.
  #
  # Delivery. GitHub's scheduler is best-effort: it drops runs under load (both
  # this repo and the Diamonds one lost 09:00 outright on 2026-08-27) and it
  # queues them late - all week it ran five to eight hours behind, and on
  # 2026-08-31 the 09:00 entry had still not queued by 10:30. The top of the hour
  # is the most congested minute there is, since it is what nearly every cron in
  # the world asks for, so these now sit at :37. A dropped or slow entry costs
  # four hours instead of a day.
  #
  # Coverage. Even delivered punctually, 09:00 and 13:00 only look at the
  # morning. Stanford on 2026-08-30 was a Sunday afternoon match that finished
  # around 20:00 UTC; both of that day's runs came before it, so the result sat
  # uncollected for sixteen hours until someone noticed. Matches finish anywhere
  # from 19:00 UTC (weekend afternoons) to 04:00 (weeknight evenings in Central
  # time), which no two fixed times cover.
  #
  # Six runs a day is affordable: a run takes about two minutes, Actions is free
  # on public repositories, the scrape is idempotent, the seed is only rewritten
  # when the data actually differs, and the APK rebuild is dispatched only on a
  # real change. A quiet run costs one scraped-data commit and nothing else.
  schedule:
    - cron: '37 1 * * *'
    - cron: '37 5 * * *'
    - cron: '37 9 * * *'
    - cron: '37 13 * * *'
    - cron: '37 17 * * *'
    - cron: '37 21 * * *'
  push:
    branches:
      - main
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-ku-volleyball.mjs'
      - 'scripts/update-seed.py'
      # A roster URL or parser change should verify itself on the spot rather
      # than wait for the next nightly cron.
      - 'scripts/opponent-sites.json'
      - 'scripts/roster-parser.mjs'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A hanging opponent site once held this job for 25 minutes with no output
    # and no data. With no limit it would have run to GitHub's 6-hour default,
    # burning the runner and skipping the night in silence. A normal run takes
    # about two minutes, so 20 is generous - and failing loudly beats hanging.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape NCAA + kuathletics data
        env:
          SEASONS: '2025 2026'
        run: node scripts/scrape-ku-volleyball.mjs

      - name: Rebuild seed from scraped data
        run: python3 scripts/update-seed.py

      - name: Commit scraped data and seed update
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraped/
          git diff --cached --quiet || git commit -m "Update scraped KU volleyball data [skip ci]"
          # The dashboard (GitHub Pages, docs/) reads its own copy of the seed.
          cp app/src/main/assets/seed.json docs/season-data.json
          git add app/src/main/assets/seed.json docs/season-data.json
          if git diff --cached --quiet; then
            echo "seed_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update season data from nightly scrape [skip ci]"
            echo "seed_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # Pushes made with GITHUB_TOKEN never trigger push workflows (GitHub's
      # recursion guard), so the APK rebuild must be dispatched explicitly —
      # workflow_dispatch is exempt from that guard.
      - name: Rebuild APK with new season data
        if: steps.commit.outputs.seed_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
